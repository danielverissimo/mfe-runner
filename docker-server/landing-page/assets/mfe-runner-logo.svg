<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="160" y1="120" x2="850" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8172ff"/>
      <stop offset="0.52" stop-color="#6757ef"/>
      <stop offset="1" stop-color="#5144d4"/>
    </linearGradient>
    <linearGradient id="highlight" x1="240" y1="170" x2="780" y2="830" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#32289d" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect
    x="74"
    y="74"
    width="876"
    height="876"
    rx="232"
    fill="url(#background)"
    filter="url(#shadow)"
  />
  <rect
    x="78"
    y="78"
    width="868"
    height="868"
    rx="228"
    fill="none"
    stroke="url(#highlight)"
    stroke-width="8"
  />

  <g fill="#ffffff">
    <rect x="292" y="294" width="118" height="390" rx="55" transform="rotate(30 351 489)"/>
    <rect x="451" y="350" width="118" height="332" rx="55" transform="rotate(30 510 516)"/>
    <rect x="612" y="274" width="118" height="424" rx="55" transform="rotate(30 671 486)"/>
  </g>
</svg>
